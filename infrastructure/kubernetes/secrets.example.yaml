# ── Migration credentials (used only by the emb-migrate Job).
# Prefer a separate schema-owner / DDL role per database; the runtime roles
# above then need no DDL rights. (Docker Compose uses one owner role per DB.)
apiVersion: v1
kind: Secret
metadata: { name: emb-migration-db }
type: Opaque
stringData:
  AUTH_SERVICE_DATABASE_URL: postgresql://auth_owner:REPLACE_ME@postgres.example.internal:5432/auth_db?sslmode=require
  USER_SERVICE_DATABASE_URL: postgresql://users_owner:REPLACE_ME@postgres.example.internal:5432/users_db?sslmode=require
  PRODUCT_SERVICE_DATABASE_URL: postgresql://product_owner:REPLACE_ME@postgres.example.internal:5432/product_db?sslmode=require
  INVENTORY_SERVICE_DATABASE_URL: postgresql://inventory_owner:REPLACE_ME@postgres.example.internal:5432/inventory_db?sslmode=require
  ORDER_SERVICE_DATABASE_URL: postgresql://orders_owner:REPLACE_ME@postgres.example.internal:5432/orders_db?sslmode=require
  PAYMENT_SERVICE_DATABASE_URL: postgresql://payment_owner:REPLACE_ME@postgres.example.internal:5432/payment_db?sslmode=require
  NOTIFICATION_SERVICE_DATABASE_URL: postgresql://notification_owner:REPLACE_ME@postgres.example.internal:5432/notification_db?sslmode=require
  AUDIT_SERVICE_DATABASE_URL: postgresql://audit_owner:REPLACE_ME@postgres.example.internal:5432/audit_db?sslmode=require
  WORKER_DATABASE_URL: postgresql://worker_owner:REPLACE_ME@postgres.example.internal:5432/worker_db?sslmode=require
---
# ── Shared infrastructure credentials.
apiVersion: v1
kind: Secret
metadata: { name: emb-rabbitmq }
type: Opaque
stringData:
  RABBITMQ_URL: amqps://emb:REPLACE_ME@rabbitmq.example.internal:5671
---
apiVersion: v1
kind: Secret
metadata: { name: emb-redis }
type: Opaque
stringData:
  REDIS_URL: rediss://default:REPLACE_ME@redis.example.internal:6379
---
# Shared secret for /internal/* calls (order → product, order → payment). At least 32 characters.
# Generate with: openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata: { name: emb-internal-api-token }
type: Opaque
stringData:
  INTERNAL_API_TOKEN: REPLACE_ME_WITH_AT_LEAST_32_RANDOM_CHARACTERS
---
# ES256 (P-256) private key in PKCS#8 PEM, mounted as a file into auth-service.
# Create from a file instead of pasting:  kubectl -n emb create secret generic
#   auth-jwt-signing-key --from-file=jwt-private.pem=./jwt-private.pem
apiVersion: v1
kind: Secret
metadata: { name: auth-jwt-signing-key }
type: Opaque
stringData:
  jwt-private.pem: |
    REPLACE_ME (-----BEGIN PRIVATE KEY----- ... -----END PRIVATE KEY-----)
---
# OPTIONAL: bootstrap admin, created once if absent. Remove the Secret (and
# rotate the password through the API) after the first deployment.
apiVersion: v1
kind: Secret
metadata: { name: auth-admin-bootstrap }
type: Opaque
stringData:
  ADMIN_EMAIL: admin@example.com
  ADMIN_BOOTSTRAP_PASSWORD: REPLACE_ME
---
# OPTIONAL: SMTP relay credentials (only with EMAIL_TRANSPORT=smtp).
apiVersion: v1
kind: Secret
metadata: { name: notification-smtp }
type: Opaque
stringData:
  SMTP_USER: REPLACE_ME
  SMTP_PASSWORD: REPLACE_ME
