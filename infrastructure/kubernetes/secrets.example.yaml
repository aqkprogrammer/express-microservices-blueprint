# EXAMPLE ONLY — every value is a placeholder. Do not commit real values.
#
# The base manifests reference these Secrets by name (secretKeyRef / secret
# volume) but never create them. Choose one way to provide them:
#   1. External Secrets Operator: ExternalSecret objects that sync these keys
#      from AWS Secrets Manager / GCP Secret Manager / Azure Key Vault / Vault.
#   2. Sealed Secrets: encrypt a filled-in copy with `kubeseal` and commit only
#      the SealedSecret.
#   3. Secrets Store CSI Driver: mount secrets as files (the services read
#      <NAME>_FILE, e.g. JWT_PRIVATE_KEY_FILE, DATABASE_URL_FILE).
#   4. Local clusters only: copy this file to a git-ignored location, e.g.
#        infrastructure/kubernetes/overlays/local/secrets/secrets.yaml
#      (any `secrets/` directory under infrastructure/ is in .gitignore),
#      replace every REPLACE_ME, then `kubectl apply -n emb -f <that file>`.
#
# Keys must match exactly; see docs/deployment/kubernetes.md.

# ── Runtime database credentials: one Secret per service, one database per service.
# Use a least-privilege RUNTIME role here (DML only), not the schema owner.
apiVersion: v1
kind: Secret
metadata: { name: auth-service-db }
type: Opaque
stringData:
  DATABASE_URL: postgresql://auth_svc:REPLACE_ME@postgres.example.internal:5432/auth_db?sslmode=require
---
