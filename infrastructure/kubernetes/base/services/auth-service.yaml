# auth-service — Issues ES256 access tokens and serves the JWKS every other service verifies against.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/component: backend
        network.emb/postgres-client: 'true'
        network.emb/rabbitmq-client: 'true'
      annotations:
        # For annotation-based Prometheus scraping. With the Prometheus Operator use the
        # ServiceMonitor in overlays/production-example instead.
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3001'
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: emb-app
      automountServiceAccountToken: false
      enableServiceLinks: false
      # preStop sleep (5s) + in-app graceful shutdown (SHUTDOWN_TIMEOUT_MS, default 15s) < 30s.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: auth-service
          matchLabelKeys: [pod-template-hash]
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: auth-service
          matchLabelKeys: [pod-template-hash]
      containers:
        - name: auth-service
          image: emb/auth-service
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3001 }
          envFrom:
            - configMapRef:
                name: emb-common
            - configMapRef:
                name: auth-service-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-service-db
                  key: DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: emb-rabbitmq
                  key: RABBITMQ_URL
            # The ES256 signing key is read from a file mounted from a Secret, never from an env value.
            - name: JWT_PRIVATE_KEY_FILE
              value: /run/secrets/jwt/jwt-private.pem
            # Optional: only needed for the first deployment (bootstrap admin account).
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: auth-admin-bootstrap
                  key: ADMIN_EMAIL
                  optional: true
            - name: ADMIN_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-admin-bootstrap
                  key: ADMIN_BOOTSTRAP_PASSWORD
                  optional: true
          resources:
            requests: { cpu: 200m, memory: 192Mi }
            limits: { cpu: '1', memory: 384Mi }
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              # Keep serving while the endpoint removal propagates to kube-proxy and the
              # ingress controller; SIGTERM (and the app's own drain) follows afterwards.
              exec:
                command: ['sleep', '5']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: jwt-signing-key, mountPath: /run/secrets/jwt, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: jwt-signing-key
          secret:
            secretName: auth-jwt-signing-key
            # 0440 + fsGroup 1000: readable by the app user only.
            defaultMode: 0440
            items:
              - { key: jwt-private.pem, path: jwt-private.pem }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: auth-service
  ports:
    - { name: http, port: 3001, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-service
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: backend
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
