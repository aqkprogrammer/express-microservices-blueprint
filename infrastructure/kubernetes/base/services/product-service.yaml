# product-service — Catalogue with a Redis cache-aside layer; /internal/* is called by order-service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/component: backend
spec:
  # replicas is intentionally omitted: the HorizontalPodAutoscaler below owns it.
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: product-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-service
        app.kubernetes.io/component: backend
        network.emb/postgres-client: 'true'
        network.emb/rabbitmq-client: 'true'
        network.emb/redis-client: 'true'
        network.emb/jwks-client: 'true'
      annotations:
        # For annotation-based Prometheus scraping. With the Prometheus Operator use the
        # ServiceMonitor in overlays/production-example instead.
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3003'
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: emb-app
      automountServiceAccountToken: false
      enableServiceLinks: false
      # preStop sleep (5s) + in-app graceful shutdown (SHUTDOWN_TIMEOUT_MS, default 15s) < 30s.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: product-service
          matchLabelKeys: [pod-template-hash]
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: product-service
          matchLabelKeys: [pod-template-hash]
      containers:
        - name: product-service
          image: emb/product-service
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3003 }
          envFrom:
            - configMapRef:
                name: emb-common
            - configMapRef:
                name: product-service-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: product-service-db
                  key: DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: emb-rabbitmq
                  key: RABBITMQ_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: emb-redis
                  key: REDIS_URL
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: emb-internal-api-token
                  key: INTERNAL_API_TOKEN
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              # Keep serving while the endpoint removal propagates to kube-proxy and the
              # ingress controller; SIGTERM (and the app's own drain) follows afterwards.
              exec:
                command: ['sleep', '5']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: product-service
  ports:
    - { name: http, port: 3003, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: product-service
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/component: backend
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: product-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: product-service
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: product-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
