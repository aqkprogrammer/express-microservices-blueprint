# The services never call the Kubernetes API, so they get a dedicated identity
# with no RBAC bindings and no mounted API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: emb-app
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: emb-migrator
  labels:
    app.kubernetes.io/component: migration
automountServiceAccountToken: false
