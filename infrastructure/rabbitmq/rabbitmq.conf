# Local development broker configuration.
# Queues and bindings are declared by the migrator from the topology contract
# (packages/contracts/src/topology.ts); see definitions.json for an import-ready copy.
loopback_users.guest = false
log.console.level = warning
# Bounded memory/disk usage for a laptop-sized broker.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB
# Expose per-queue metrics (depth, rates) for Prometheus.
prometheus.return_per_object_metrics = true
