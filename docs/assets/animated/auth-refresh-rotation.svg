.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.nb{font-size:10px;font-weight:600;text-anchor:middle;fill:#59636e}
.ft{font-size:10.5px;fill:#59636e}
.base{fill:none;stroke:#d1d9e0;stroke-width:1.4}
.base.async{stroke-dasharray:5 4}
.ov{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:100 110;stroke-dashoffset:0}
.dot{opacity:0}
.row{opacity:0}
.a{animation-duration:13s;animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-fill-mode:both}
.lin{animation-timing-function:linear}
.so{display:none}
@media (prefers-reduced-motion:reduce){.a{animation:none!important}.dot,.row,.ao{display:none}.so{display:inline}}
