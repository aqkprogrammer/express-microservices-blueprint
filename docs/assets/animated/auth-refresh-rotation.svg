<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="578" viewBox="0 0 1080 578" role="img" aria-labelledby="t d">
<title id="t">Refresh-token rotation with reuse detection</title>
<desc id="d">Animated sequence. Login verifies the Argon2id hash, opens a token family and returns a 15 minute ES256 access token plus refresh token R1 in an HttpOnly cookie. Refreshing with R1 revokes R1 (rotated) and issues R2 in the same family. When a stolen copy of R1 is presented again, auth-service detects reuse, revokes the whole family, publishes RefreshTokenReuseDetected through the outbox and answers 401; the legitimate client must log in again because R2 was revoked too.</desc>
