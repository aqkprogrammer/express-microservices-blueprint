<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="594" viewBox="0 0 1080 594" role="img" aria-labelledby="t d">
<title id="t">Transactional outbox</title>
<desc id="d">Animated sequence. A request handler changes business state and inserts the event into outbox_events in the same transaction, then commits. After commit it nudges the relay (otherwise the relay polls every 500 ms). The relay claims rows with UPDATE … FOR UPDATE SKIP LOCKED, setting PUBLISHING with a 30 second lease, publishes each to RabbitMQ on a confirm channel and marks it PUBLISHED after the broker confirm. Consumers de-duplicate by message id in processed_messages. Failed publishes return the row to PENDING with exponential backoff (max 60 s); rows are never dropped.</desc>
