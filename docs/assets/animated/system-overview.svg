<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="590" viewBox="0 0 1080 590" role="img" aria-labelledby="t d">
<title id="t">Express Microservices Blueprint — system overview</title>
<desc id="d">Static system overview. Clients reach only the api-gateway on port 8080, which uses Redis for rate limits and proxies to eight Express services. Each service owns one PostgreSQL database, publishes events through a transactional outbox and consumes them from RabbitMQ (exchanges domain.events, maintenance.commands and dead-letters). The worker schedules maintenance commands and archives dead letters. notification-service sends email through Mailpit. Every service exports traces to Jaeger and logs to Loki through OpenTelemetry; Prometheus scrapes metrics and Grafana shows dashboards.</desc>
